[package]
name = "gitpilot"
version = "0.1.0"
edition = "2021"
authors = ["Temesgen Sida <temesgensids@gmail.com>"]
description = "A terminal Git cockpit: stage, diff, browse, resolve conflicts, stash and cherry-pick without memorizing commands"
readme = "README.md"
repository = "https://github.com/temesgensida-code/gitpilot"
homepage = "https://github.com/temesgensida-code/gitpilot"
license = "MIT"
keywords = ["git", "tui", "ratatui", "terminal", "cockpit"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
git2 = { version = "0.19", default-features = false }
anyhow = "1"
chrono = "0.4"
